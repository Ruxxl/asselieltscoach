services:
  - type: web
    name: echo-english-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ping
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Writing Checker: модель мощнее для разбора эссе (откат на GEMINI_MODEL при исчерпании квоты).
      - key: WRITING_GEMINI_MODEL
        value: gemini-3.5-flash
      - key: TEACHER_CHAT_ID
        value: "998292747"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./echo_english.db
      # Озвучка реплик экзаменатора Speaking Practice (backend/services/tts.py).
      - key: DEEPGRAM_API_KEY
        sync: false
      # Оплата курсов через Halyk ePay (backend/services/halyk.py). Пока ключей нет — покупка без оплаты.
      - key: HALYK_CLIENT_ID
        sync: false
      - key: HALYK_CLIENT_SECRET
        sync: false
      - key: HALYK_TERMINAL_ID
        sync: false
      - key: HALYK_TEST_MODE
        value: "1"
