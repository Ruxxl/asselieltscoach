# Не даёт Render free-инстансу заснуть: бот поллит Telegram внутри веб-процесса
# (backend/main.py), поэтому спящий сервис — это и неотвечающий бот.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/ping
        # Холодный старт на Render занимает около минуты, поэтому таймаут и повторы с запасом.
        run: >-
          curl --fail --silent --show-error
          --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors
          https://echo-english-bot-7veu.onrender.com/api/ping
